<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="takephotos.css">
  <title>TakePhotos</title>
</head>
<body>

    <p class="text_takephoto"> Porfavor toma una foto que se vea clara</p>

  </Section>

</html>
